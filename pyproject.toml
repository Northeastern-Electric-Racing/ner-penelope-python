[project]
name = "ner-penelope"
version = "0.1.0"
description = "A DB wrapper for NER Odyssey data, all cars"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
]

[project.optional-dependencies]
numpy = ["numpy (>=2.4.4,<3.0.0)"]
polars = ["polars (>=1.40.1,<2.0.0)"]
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pandas (>=3.0.2,<4.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)"
]
